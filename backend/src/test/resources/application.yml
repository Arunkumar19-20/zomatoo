spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope:
              - email
              - profile

server:
  port: 8081

jwt:
  secret: test-jwt-secret-key-that-is-at-least-256-bits-long-for-testing-purposes-123456

stripe:
  secret:
    key: sk_test_mock_secret_key
  public:
    key: pk_test_mock_public_key
  webhook:
    secret: whsec_test_mock_secret
