<!DOCTYPE html>
<html>
<head>
    <title>Zomato Login</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #ff4b2b;
        }

        .subtitle {
            margin: 10px 0 30px;
            color: #555;
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: white;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 500;
        }

        .google-btn:hover {
            background: #f5f5f5;
            transform: scale(1.02);
        }

        .google-btn img {
            width: 20px;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: gray;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="logo">Zomato</div>
    <div class="subtitle">Sign in to continue</div>

    <a href="/oauth2/authorization/google" style="text-decoration:none;">
        <div class="google-btn">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg">
            Continue with Google
        </div>
    </a>

    <div class="footer">
        By continuing, you agree to our Terms & Conditions
    </div>
</div>

</body>
</html>
