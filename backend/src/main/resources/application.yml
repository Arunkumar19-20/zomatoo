spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/zomato}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
            scope:
              - email
              - profile

server:
  port: 8080
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: 10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|169\\.254\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1

jwt:
  # Always set JWT_SECRET outside local development. With the 'prod' profile active the app refuses to start on this fallback.
  secret: ${JWT_SECRET:change-this-to-a-secure-random-string-at-least-256-bits-long}
  access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:900}

# Sample restaurants, drops and the accounts with a known password (admin@/owner@/customer@cravey.com, Password123!). Off unless the
# 'demo' or 'dev' profile is active or SEED_DEMO_ACCOUNTS=true: never switch it on for a database real people use.
seed:
  demo-accounts: ${SEED_DEMO_ACCOUNTS:false}

app:
  order:
    abandoned-timeout-minutes: ${ORDER_ABANDONED_TIMEOUT_MINUTES:15}
    cleanup-interval-ms: ${ORDER_CLEANUP_INTERVAL_MS:300000}

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY:}
  public:
    key: ${STRIPE_PUBLIC_KEY:}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:}

uploads:
  # where owners' dish photos are kept (the folder is created on first upload)
  dir: ${UPLOADS_DIR:uploads}
